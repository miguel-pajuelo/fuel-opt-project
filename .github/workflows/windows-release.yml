name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version (MAJOR.MINOR.PATCH)"
        required: true
        default: "0.1.1"
        type: string

permissions:
  contents: read

concurrency:
  group: fuelopt-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit Windows artifacts
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      license-approved: ${{ steps.license.outputs.license-approved }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      REQUESTED_VERSION: ${{ inputs.version }}
      PYTHON_VERSION: "3.12.10"
      INNO_VERSION: "6.7.3"
      INNO_INSTALLER_SHA256: "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate release identity and derive version
        id: version
        shell: pwsh
        run: |
          $isReleaseTag = $env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag'
          if ($isReleaseTag) {
            if ($env:REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH; received: $env:REF_NAME"
            }
            $version = $Matches.version
          } else {
            $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION.Trim() } else { '0.1.1' }
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Dry-run versions must use MAJOR.MINOR.PATCH; received: $version"
            }
          }
          $artifactName = "FuelOpt-$version-windows"
          "FUELOPT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Release mode: $isReleaseTag; version: $version"

      - name: Enforce release LICENSE gate
        id: license
        shell: pwsh
        run: |
          $mode = if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') { 'tag' } else { 'dry-run' }
          python scripts\check_release_license.py --mode $mode --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            throw 'LICENSE gate rejected this release context.'
          }

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-build.txt
            requirements-test.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-runtime.lock --requirement requirements-build.txt --requirement requirements-test.txt

      - name: Run release checks
        shell: cmd
        run: scripts\release_check.cmd

      - name: Clean release outputs
        shell: pwsh
        run: scripts\clean_release_artifacts.ps1

      - name: Build audited PyInstaller onedir bundle
        shell: cmd
        run: scripts\build_onedir.cmd

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $env:INNO_INSTALLER_SHA256) {
            throw "Inno Setup installer hash mismatch: $actualHash"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Inno Setup installer signature is invalid or has an unexpected publisher.'
          }
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Build audited Inno Setup installer
        shell: cmd
        run: scripts\build_installer.cmd

      - name: Package onedir bundle and checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'dist\release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $bundleArchive = Join-Path $releaseDir "FuelOpt-$env:FUELOPT_VERSION-windows-x64.zip"
          $setupSource = Join-Path $PWD "dist\installer\FuelOpt-Setup-$env:FUELOPT_VERSION.exe"
          $setupTarget = Join-Path $releaseDir (Split-Path $setupSource -Leaf)
          Compress-Archive -Path 'dist\FuelOpt' -DestinationPath $bundleArchive -CompressionLevel Optimal
          Copy-Item -LiteralPath $setupSource -Destination $setupTarget
          $artifacts = @($setupTarget, $bundleArchive)
          $checksumLines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $artifact -Leaf)"
          }
          $checksumLines | Set-Content -LiteralPath (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8

      - name: Audit release payload
        shell: pwsh
        run: |
          python tests\bundle_check.py --bundle dist\FuelOpt
          python tests\version_info_check.py --exe dist\FuelOpt\FuelOpt.exe --expected-version $env:FUELOPT_VERSION
          python tests\bundle_smoke_check.py --bundle dist\FuelOpt
          python tests\installer_check.py --require-bundle
          $releaseFiles = @(Get-ChildItem -LiteralPath 'dist\release' -File)
          if ($releaseFiles.Count -ne 3) {
            throw "Expected installer, onedir ZIP and SHA256SUMS.txt; found $($releaseFiles.Count)."
          }
          $setup = Get-Item "dist\release\FuelOpt-Setup-$env:FUELOPT_VERSION.exe"
          $versionInfo = $setup.VersionInfo
          if ($versionInfo.ProductVersion.Trim() -ne $env:FUELOPT_VERSION -or $versionInfo.FileVersion.Trim() -ne $env:FUELOPT_VERSION) {
            throw "Installer metadata version mismatch: product=$($versionInfo.ProductVersion), file=$($versionInfo.FileVersion)"
          }
          if ((Get-AuthenticodeSignature -LiteralPath $setup.FullName).Status -ne 'NotSigned') {
            throw 'Patch 7 expects the installer to remain unsigned until code signing is configured.'
          }

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish-release:
    name: Publish GitHub Release assets
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && needs.build.outputs.license-approved == 'true' }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FUELOPT_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download audited build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/release

      - name: Create, verify and publish GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($repo) -or [string]::IsNullOrWhiteSpace($tag)) {
            throw 'GITHUB_REPOSITORY and RELEASE_TAG are required.'
          }
          $files = @(
            "dist\release\FuelOpt-Setup-$env:FUELOPT_VERSION.exe",
            "dist\release\FuelOpt-$env:FUELOPT_VERSION-windows-x64.zip",
            'dist\release\SHA256SUMS.txt'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Audited release asset is missing: $file"
            }
          }

          $expectedTitle = "FuelOpt $env:FUELOPT_VERSION"
          $expectedBody = "FuelOpt $env:FUELOPT_VERSION`n`nArtefactos generados para la etiqueta $tag. Verifica el instalador y el ZIP portable con SHA256SUMS.txt antes de utilizarlos.`n"
          $releaseNotes = Join-Path $env:RUNNER_TEMP 'fuelopt-release-notes.txt'
          [System.IO.File]::WriteAllText(
            $releaseNotes,
            $expectedBody,
            [System.Text.UTF8Encoding]::new($false)
          )

          function Assert-TagCommit {
            $resolved = gh api "repos/$repo/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve release tag $tag in $repo."
            }
            $resolved = $resolved.Trim()
            if ($resolved -ne $env:GITHUB_SHA) {
              throw "Release tag $tag resolves to $resolved, expected $env:GITHUB_SHA."
            }
            return $resolved
          }

          function Find-Release {
            $pagesJson = Join-Path $env:RUNNER_TEMP 'fuelopt-release-pages.json'
            $lookupJson = Join-Path $env:RUNNER_TEMP 'fuelopt-release-lookup.json'
            gh api --paginate --slurp "repos/$repo/releases?per_page=100" |
              Set-Content -LiteralPath $pagesJson -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate GitHub Releases for $repo."
            }
            python scripts\verify_release_assets.py find `
              --releases-json $pagesJson `
              --expected-tag $tag `
              --output $lookupJson | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release lookup for $tag was ambiguous or malformed."
            }
            return (Get-Content -LiteralPath $lookupJson -Raw -Encoding utf8 | ConvertFrom-Json)
          }

          function Get-ReleaseSnapshot {
            param(
              [long]$ReleaseId,
              [bool]$ExpectedDraft,
              [string]$OutputPath
            )
            $releaseJson = Join-Path $env:RUNNER_TEMP "fuelopt-release-$ReleaseId.json"
            $assetsJson = Join-Path $env:RUNNER_TEMP "fuelopt-release-$ReleaseId-assets.json"
            gh api "repos/$repo/releases/$ReleaseId" |
              Set-Content -LiteralPath $releaseJson -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect GitHub Release ID $ReleaseId."
            }
            gh api --paginate --slurp "repos/$repo/releases/$ReleaseId/assets?per_page=100" |
              Set-Content -LiteralPath $assetsJson -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect assets for GitHub Release ID $ReleaseId."
            }
            $resolvedTagCommit = Assert-TagCommit
            $expectedDraftText = $ExpectedDraft.ToString().ToLowerInvariant()
            python scripts\verify_release_assets.py snapshot `
              --release-json $releaseJson `
              --assets-json $assetsJson `
              --release-dir dist\release `
              --version $env:FUELOPT_VERSION `
              --expected-tag $tag `
              --expected-commit $env:GITHUB_SHA `
              --resolved-tag-commit $resolvedTagCommit `
              --expected-title $expectedTitle `
              --expected-body-file $releaseNotes `
              --expected-draft $expectedDraftText `
              --expected-release-id $ReleaseId `
              --output $OutputPath | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release ID $ReleaseId differs from the audited metadata or payload."
            }
          }

          function Publish-VerifiedDraft {
            param(
              [long]$ReleaseId,
              [string]$ValidatedSnapshot
            )
            $prePublishSnapshot = Join-Path $env:RUNNER_TEMP "fuelopt-release-$ReleaseId-prepublish.json"
            $publishedSnapshot = Join-Path $env:RUNNER_TEMP "fuelopt-release-$ReleaseId-published.json"
            Get-ReleaseSnapshot -ReleaseId $ReleaseId -ExpectedDraft $true -OutputPath $prePublishSnapshot
            python scripts\verify_release_assets.py compare `
              --first $ValidatedSnapshot `
              --second $prePublishSnapshot | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release ID $ReleaseId changed before publication."
            }
            # GitHub has no atomic compare-and-publish operation. This second snapshot
            # minimizes, but cannot eliminate, races with external manual edits.
            gh release edit $tag --draft=false --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not publish the verified draft release $tag."
            }
            Get-ReleaseSnapshot -ReleaseId $ReleaseId -ExpectedDraft $false -OutputPath $publishedSnapshot
            python scripts\verify_release_assets.py transition `
              --draft $prePublishSnapshot `
              --published $publishedSnapshot | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Published GitHub Release $tag changed unexpectedly."
            }
          }

          Assert-TagCommit | Out-Null
          $lookup = Find-Release
          if ($lookup.status -eq 'absent') {
            gh release create $tag @files `
              --draft `
              --verify-tag `
              --target "$env:GITHUB_SHA" `
              --title $expectedTitle `
              --notes-file $releaseNotes `
              --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft GitHub Release $tag."
            }
            $lookup = Find-Release
            if ($lookup.status -ne 'found' -or -not [bool]$lookup.draft) {
              throw "GitHub Release $tag was not created as one unambiguous draft."
            }
          }

          $initialSnapshot = Join-Path $env:RUNNER_TEMP "fuelopt-release-$($lookup.id)-initial.json"
          Get-ReleaseSnapshot `
            -ReleaseId ([long]$lookup.id) `
            -ExpectedDraft ([bool]$lookup.draft) `
            -OutputPath $initialSnapshot
          if ([bool]$lookup.draft) {
            Publish-VerifiedDraft -ReleaseId ([long]$lookup.id) -ValidatedSnapshot $initialSnapshot
          } else {
            "GitHub Release $tag already exists with identical metadata and assets; no changes were made."
          }
